name: Desktop Release

on:
  push:
    tags: ["ZMyusic-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading ZMyusic-v"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux - AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#ZMyusic-v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pzmyusic.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pzmyusic.version=${{ steps.version.outputs.value }}

      # A jar without the analyser or the models still starts, and quietly
      # loses Automix: exactly the failure this check exists to catch.
      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/ZMyusic/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libzmyusic_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/ZMyusic \
            dist/ZMyusic-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/ZMyusic-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/ZMyusic-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows - installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The analyser and the WinRT media bridge both need a MinGW C++ compiler.
      # The image ships MSYS2 at C:\msys64, but no mingw64 toolchain and nothing on
      # PATH, so install g++ into it when it is not already there. Ninja and CMake
      # are preinstalled.
      - name: MinGW on PATH
        shell: pwsh
        run: |
          $gpp = (Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          if (-not $gpp) {
            $dir = @(
              "C:\msys64\mingw64\bin",
              "C:\msys64\ucrt64\bin",
              "C:\ProgramData\mingw64\mingw64\bin",
              "C:\tools\mingw64\bin"
            ) | Where-Object { Test-Path (Join-Path $_ "g++.exe") } | Select-Object -First 1
            if ($dir) { $gpp = Join-Path $dir "g++.exe" }
          }
          if (-not $gpp -and (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Host "installing the mingw64 toolchain into MSYS2"
            & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc"
            if (Test-Path "C:\msys64\mingw64\bin\g++.exe") { $gpp = "C:\msys64\mingw64\bin\g++.exe" }
          }
          if (-not $gpp) { throw "g++.exe not found: the build would ship without the Automix analyser" }
          Split-Path $gpp | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gpp --version | Select-Object -First 1
          (Get-Command ninja.exe).Source
          (Get-Command cmake.exe).Source

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#ZMyusic-v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pzmyusic.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pzmyusic.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/ZMyusic/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/zmyusic_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          jar tf "$jar" | grep -q 'native/zmyusic_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $dist = (Resolve-Path dist).Path
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/ZMyusic-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/ZMyusic-$v-windows-x64-setup.exe"
          # 7z stores the path it is handed, so run it from the app directory and
          # hand it "ZMyusic". Otherwise the ZIP starts with desktopApp/build/...
          # and extracting it does not produce a usable ZMyusic folder.
          Push-Location desktopApp/build/compose/binaries/main/app
          try {
            Remove-Item "$dist/ZMyusic-$v-windows-x64-portable.zip" -ErrorAction SilentlyContinue
            7z a -tzip -mx=5 "$dist/ZMyusic-$v-windows-x64-portable.zip" "ZMyusic" | Out-Null
          } finally {
            Pop-Location
          }

          # The release ZIP is the product: check what users will actually get,
          # not just what the build directory looked like.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$dist/ZMyusic-$v-windows-x64-portable.zip")
          try {
            $roots = @($zip.Entries | ForEach-Object { ($_.FullName -replace '\\', '/').Split('/')[0] } | Sort-Object -Unique)
            if ($roots.Count -ne 1 -or $roots[0] -ne 'ZMyusic') {
              throw "Portable ZIP must contain only ZMyusic/, found: $($roots -join ', ')"
            }
            $exe = @($zip.Entries | Where-Object { ($_.FullName -replace '\\', '/') -eq 'ZMyusic/ZMyusic.exe' })
            if ($exe.Count -ne 1) {
              throw "Portable ZIP is missing ZMyusic/ZMyusic.exe."
            }
            $cfg = $zip.Entries | Where-Object { ($_.FullName -replace '\\', '/') -eq 'ZMyusic/app/ZMyusic.cfg' } | Select-Object -First 1
            if (-not $cfg) {
              throw "Portable ZIP is missing ZMyusic/app/ZMyusic.cfg."
            }
            $reader = New-Object IO.StreamReader($cfg.Open())
            try {
              $cfgText = $reader.ReadToEnd()
            } finally {
              $reader.Close()
            }
            foreach ($flag in '-Xmx512m', '-XX:+UseG1GC', '-XX:G1PeriodicGCInterval=20000', '-XX:G1PeriodicGCSystemLoadThreshold=0') {
              if (-not $cfgText.Contains($flag)) {
                throw "Portable app image is missing JVM flag $flag."
              }
            }
          } finally {
            $zip.Dispose()
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#ZMyusic-v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          : > local.properties
          [ -n "${{ secrets.LASTFM_API_KEY }}" ] && echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          [ -n "${{ secrets.LASTFM_SECRET }}" ] && echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          [ -n "${{ secrets.LISTEN_TOGETHER_SERVER }}" ] && echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          exit 0

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pzmyusic.version=${{ steps.version.outputs.value }}

      # createDistributable, not packageDmg: the bundle is signed before the
      # DMG is built, so the signature is the one inside the disk image.
      - name: Build the app
        run: |
          ./gradlew :desktopApp:createDistributable \
            -Pzmyusic.version=${{ steps.version.outputs.value }}

      - name: Sign the app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="desktopApp/build/compose/binaries/main/app/ZMyusic.app"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            KEYCHAIN="$RUNNER_TEMP/music.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/music.p12"
            security create-keychain -p actions "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p actions "$KEYCHAIN"
            security import "$RUNNER_TEMP/music.p12" -k "$KEYCHAIN" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          else
            # Ad-hoc signing is enough for the app to start on Apple Silicon;
            # Gatekeeper still wants the user to clear the quarantine flag.
            codesign --force --deep --sign - "$APP"
          fi

      - name: Build the DMG
        run: |
          v=${{ steps.version.outputs.value }}
          # The stage has to hold the signed bundle itself: pointing hdiutil at a
          # directory that only had the /Applications link made a 5 KB disk image
          # with no app in it, and the job still went green.
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R desktopApp/build/compose/binaries/main/app/ZMyusic.app "$stage/"
          ln -sfn /Applications "$stage/Applications"
          dmg="ZMyusic-$v-macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "ZMyusic" -srcfolder "$stage" -ov -format UDZO "$dmg"
          # A DMG that missed the app is a few kilobytes: fail instead of publishing it.
          test "$(stat -f%z "$dmg")" -gt 1000000
          mkdir -p dist
          mv "$dmg" dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*.dmg

  release:
    name: Publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Work out the version
        id: release-version
        if: github.ref_type == 'tag'
        run: echo "value=${GITHUB_REF_NAME#ZMyusic-v}" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZMyusic ${{ steps.release-version.outputs.value }}
          draft: true
          # The body lives in one file so the iOS build, which usually creates the
          # draft first, writes the same one.
          body_path: .github/release-body.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
